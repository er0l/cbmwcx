[common]
; log level: 0=off, 1=errors, 2=errors+warnings, 3=info, 4=verbose
logLevel=0

; PETSCII display: 0=legacy ASCII, 1=Unicode, 2=Style64 C64 font
petsciiMode=1

; 0=uppercase/graphics (C64 default), 1=lowercase/uppercase
petsciiLowercase=0

; show named scratched (deleted) entries as hidden .del files
showScratchedFiles=0

; ONLY show scratched files (no other files)
showONLYScratchedFiles=0

; show disk directory block counts in the Size column (listing only)
showFileSizeInBlocks=0

; show a read-only free-block information row in D64 listings
showFreeBlocks=0

; always append .prg extension (even to PRG files)
appendPrgExtension=0

; ignore error codes from error table if available
ignoreErrorTable=0

; fill deleted file sectors with 0x00 on delete
eraseDeletedSectors=0
